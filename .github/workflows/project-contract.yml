name: Project contract

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: project-contract-${{ github.ref }}
  cancel-in-progress: true

jobs:
  planning:
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
      - name: Validate planning contract
        run: python tools/check_project_docs.py
      - name: Validator regression tests
        run: python -m unittest discover -s tests -p test_project_docs.py -v
      - name: Family installer archive regression tests
        run: python -m unittest discover -s tests -p 'test_family_*.py' -v
      - name: Installer download recovery tests
        run: python -m unittest discover -s tests -p test_install_download.py -v
      # Uses PATH/Program Files LLVM on hosted Windows; no private inputs.
      # Green includes an explicitly expected M7.4 defect, not gameplay proof.
      - name: Production input, resource policy and rollback regression tests
        run: python tools/run_rollback_tests.py
      - name: Rollback comparison failure regressions
        run: python -m unittest discover -s tests -p test_rollback_comparators.py -v
      - name: Rollback trace integrity regressions
        run: python -m unittest discover -s tests -p test_rollback_trace.py -v
      - name: Bounded fighter trace regressions
        run: python -m unittest discover -s tests -p test_bounded_trace_cmp.py -v
      - name: Restore observation integrity regressions
        run: python -m unittest discover -s tests -p test_restore_probe.py -v
      - name: Refused restore preservation regressions
        run: python -m unittest discover -s tests -p test_restore_refusal.py -v
      - name: Native hold failure lifecycle regressions
        run: python -m unittest discover -s tests -p test_native_hold_source.py -v
      - name: Native bookkeeping observation regressions
        run: python -m unittest discover -s tests -p test_native_audit_source.py -v
      - name: Suspended fiber payload observation regressions
        run: python -m unittest discover -s tests -p test_fiber_payload_source.py -v
      - name: Writer observation integrity regressions
        run: python -m unittest discover -s tests -p test_writer_probe.py -v
      - name: Catch insertion capacity regressions
        run: python -m unittest discover -s tests -p test_catch_source.py -v
      - name: Catch restore preparation regressions
        run: python -m unittest discover -s tests -p test_catch_preflight_source.py -v
      - name: Learned startup ownership regressions
        run: python -m unittest discover -s tests -p test_learned_startup_source.py -v
      - name: Presentation resource publication regressions
        run: python -m unittest discover -s tests -p test_presentation_resources_source.py -v
      - name: Learned tracking failure regressions
        run: python -m unittest discover -s tests -p test_learned_tracking_source.py -v
      - name: Capture preparation failure regressions
        run: python -m unittest discover -s tests -p test_capture_reservation_source.py -v
      - name: Capture pool ownership regressions
        run: python -m unittest discover -s tests -p test_capture_pool_source.py -v
      - name: Copy worker OS failure and lifetime regressions
        run: python -m unittest discover -s tests -p test_copy_workers_source.py -v
      - name: Range inventory completeness regressions
        run: python -m unittest discover -s tests -p test_range_inventory_source.py -v
      - name: Runtime trial fatal-log regressions
        run: python -m unittest discover -s tests -p test_runtime_trial.py -v
      - name: Watchdog hold ownership regressions
        run: python -m unittest discover -s tests -p test_watchdog_source.py -v
      - name: Extras inventory regressions
        run: python -m unittest discover -s tests -p test_extra_inventory_source.py -v
      - name: Rebase resource preparation regressions
        run: python -m unittest discover -s tests -p test_rebase_source.py -v
      - name: Initial mark setup ownership regressions
        run: python -m unittest discover -s tests -p test_mark_setup_source.py -v
      - name: Block sweep fallback regressions
        run: python -m unittest discover -s tests -p test_block_sweep_source.py -v
      - name: Native inventory and fiber cache regressions
        run: python -m unittest discover -s tests -p test_native_inventory_source.py -v
      - name: Live continuation inventory regressions
        run: python -m unittest discover -s tests -p test_live_inventory_source.py -v
      - name: Restore inventory refusal ownership regressions
        run: python -m unittest discover -s tests -p test_restore_inventory_source.py -v
      - name: Historical fiber inventory ownership regressions
        run: python -m unittest discover -s tests -p test_historical_inventory_source.py -v
      - name: Host stack note completeness regressions
        run: python -m unittest discover -s tests -p test_host_stack_notes_source.py -v
      - name: Ring initialization ownership regressions
        run: python -m unittest discover -s tests -p test_ring_init_source.py -v
      - name: Module mark-map publication regressions
        run: python -m unittest discover -s tests -p test_mark_modules_source.py -v
      - name: Memory inventory completeness regressions
        run: python -m unittest discover -s tests -p test_memory_inventory_source.py -v
      - name: Host thread inventory completeness regressions
        run: python -m unittest discover -s tests -p test_host_thread_inventory_source.py -v
      - name: Fighter inventory and saved-range cleanup regressions
        run: python -m unittest discover -s tests -p test_fighter_inventory_source.py -v
      - name: Diagnostic allocation ownership regressions
        run: python -m unittest discover -s tests -p test_diagnostic_resources_source.py -v
      - name: Optional capture-mode resource regressions
        run: python -m unittest discover -s tests -p test_capture_mode_resources_source.py -v
      - name: Scratch ownership and trace completion regressions
        run: python -m unittest discover -s tests -p test_diagnostic_completion_source.py -v
